name: Tag version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create tag if it does not exist
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping."
          else
            git tag "${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
            echo "Tagged ${{ steps.version.outputs.tag }}"
          fi
